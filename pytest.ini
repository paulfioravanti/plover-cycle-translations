[pytest]
# Since the cycle module uses Plover modules, it cannot currently be included
# for testing
addopts = --ignore=src/plover_cycle_translations/translation/cycle.py
# Ignore issues related to deprecated calls in Darwin bridging libraries.
# REF: https://docs.pytest.org/en/stable/how-to/capture-warnings.html#controlling-warnings
filterwarnings =
    ignore:pkg_resources is deprecated as an API:DeprecationWarning
    ignore:Deprecated call to `pkg_resources\.declare_namespace\(\'PyObjCTools\'\)`:DeprecationWarning
pythonpath = src
